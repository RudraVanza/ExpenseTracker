{% extends "base.html" %}

{% block title %}FINORA - Add Expense{% endblock %}

{% block content %}
<div class="max-w-xl">
    <div class="mb-8">
        <h2 class="text-2xl font-bold text-slate-900">Add Expense</h2>
        <p class="text-slate-500 mt-1">Date and time are added automatically</p>
    </div>

    <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6">
        <form method="POST" id="expense-form" action="{{ url_for('add_expense') }}" class="space-y-5">
            <!-- Amount -->
            <div>
                <label for="amount" class="block text-sm font-medium text-slate-700 mb-1">Amount (₹)</label>
                <input type="number" step="0.01" min="0.01" name="amount" id="amount" required
                       value="{{ form_data.get('amount', '') }}"
                       class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition"
                       placeholder="e.g. 250">
            </div>

            <!-- Category -->
            <div>
                <label for="label">Expense Label</label>

                <input
                    type="text"
                    id="label"
                    name="label"
                    list="expense-labels"
                    placeholder="Type an expense..."
                    required
                    class="w-full px-4 py-3 border rounded-lg"
                >

                <datalist id="expense-labels">
                    <option value="Food">
                    <option value="Travel">
                    <option value="Shopping">
                    <option value="Bills">
                    <option value="Education">
                    <option value="Entertainment">
                    <option value="Health">
                    <option value="Petrol">
                    <option value="Movies">
                </datalist>
            </div>

            <!-- Custom label (shown when Other is selected) -->
            <div id="custom-label-group" class="hidden">
                <label for="custom_label" class="block text-sm font-medium text-slate-700 mb-1">Custom Label</label>
                <input type="text" name="custom_label" id="custom_label"
                       value="{{ form_data.get('custom_label', '') }}"
                       class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition"
                       placeholder="Enter your own category name">
            </div>

            <!-- Description -->
            <div>
                <label for="description" class="block text-sm font-medium text-slate-700 mb-1">Description (optional)</label>
                <textarea name="description" id="description" rows="3"
                          class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition resize-none"
                          placeholder="e.g. Lunch with friends">{{ form_data.get('description', '') }}</textarea>
            </div>

            <div class="flex gap-3 pt-2">
                <button
                    type="submit"
                    id="save-expense-btn"
                    class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg transition-colors"
                >
                    <span id="save-btn-text">Save Expense</span>
                </button>
                <a href="{{ url_for('dashboard') }}"
                   class="px-6 py-2.5 border border-slate-300 text-slate-700 rounded-lg font-medium hover:bg-slate-50 transition-colors">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>

<script>
    const categorySelect = document.getElementById('category');
    const customLabelGroup = document.getElementById('custom-label-group');

    function toggleCustomLabel() {
        if (categorySelect.value === 'Other') {
            customLabelGroup.classList.remove('hidden');
        } else {
            customLabelGroup.classList.add('hidden');
        }
    }

    categorySelect.addEventListener('change', toggleCustomLabel);
    toggleCustomLabel();
</script>


<script>
    const expenseForm = document.getElementById("expense-form");

    expenseForm.addEventListener("submit", function () {

        const button = document.getElementById("save-expense-btn");
        const text = document.getElementById("save-btn-text");

        // Prevent double submission
        if (button.disabled) {
            return false;
        }

        // Disable button immediately
        button.disabled = true;

        // Change button appearance
        button.classList.add(
            "opacity-70",
            "cursor-not-allowed"
        );

        // Show loading state
        text.innerHTML = `
            <span class="inline-flex items-center gap-2">
                <svg class="animate-spin h-4 w-4"
                     viewBox="0 0 24 24"
                     fill="none">

                    <circle
                        class="opacity-25"
                        cx="12"
                        cy="12"
                        r="10"
                        stroke="currentColor"
                        stroke-width="4">
                    </circle>

                    <path
                        class="opacity-75"
                        fill="currentColor"
                        d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z">
                    </path>

                </svg>

                Saving...
            </span>
        `;
    });
</script>

{% endblock %}
