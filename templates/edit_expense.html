{% extends "base.html" %}

{% block title %}FINORA - Edit Expense{% endblock %}

{% block content %}
<div class="max-w-xl">
    <div class="mb-8">
        <h2 class="text-2xl font-bold text-slate-900">Edit Expense</h2>
        <p class="text-slate-500 mt-1">ID, date, and time cannot be changed</p>
    </div>

    <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6">
        <!-- Read-only info -->
        <div class="grid grid-cols-3 gap-4 mb-6 p-4 bg-slate-50 rounded-lg text-sm">
            <div>
                <p class="text-slate-500">ID</p>
                <p class="font-semibold text-slate-900">#{{ expense.id }}</p>
            </div>
            <div>
                <p class="text-slate-500">Date</p>
                <p class="font-semibold text-slate-900">{{ expense.date }}</p>
            </div>
            <div>
                <p class="text-slate-500">Time</p>
                <p class="font-semibold text-slate-900">{{ expense.time }}</p>
            </div>
        </div>

        <form method="POST" action="{{ url_for('edit_expense', expense_id=expense.id) }}" class="space-y-5">
            <!-- Amount -->
            <div>
                <label for="amount" class="block text-sm font-medium text-slate-700 mb-1">Amount (₹)</label>
                <input type="number" step="0.01" min="0.01" name="amount" id="amount" required
                       value="{{ form_data.get('amount', expense.amount) }}"
                       class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition">
            </div>

            <!-- Category -->
            <div>
                <label for="label" class="block text-sm font-medium text-gray-700 mb-2">
                    Expense Label
                </label>

                <input
                    type="text"
                    id="label"
                    name="label"
                    list="expense-labels"
                    value="{{ form_data.get('label', expense.label) }}"
                    placeholder="Type an expense..."
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg
                        focus:outline-none focus:ring-2 focus:ring-blue-500"
                >

                <datalist id="expense-labels">
                    <option value="Food">
                    <option value="Travel">
                    <option value="Shopping">
                    <option value="Bills">
                    <option value="Education">
                    <option value="Entertainment">
                    <option value="Health">
                    <option value="Petrol">
                    <option value="Movies">
                </datalist>
            </div>

            <!-- Custom label -->
            <div id="custom-label-group" class="{% if selected_category != 'Other' and not form_data.get('category') == 'Other' %}hidden{% endif %}">
                <label for="custom_label" class="block text-sm font-medium text-slate-700 mb-1">Custom Label</label>
                <input type="text" name="custom_label" id="custom_label"
                       value="{{ form_data.get('custom_label', expense.label if selected_category == 'Other' else '') }}"
                       class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition">
            </div>

            <!-- Description -->
            <div>
                <label for="description" class="block text-sm font-medium text-slate-700 mb-1">Description (optional)</label>
                <textarea name="description" id="description" rows="3"
                          class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition resize-none">{{ form_data.get('description', expense.description) }}</textarea>
            </div>

            <div class="flex gap-3 pt-2">
                <button type="submit"
                        class="px-6 py-2.5 bg-primary-600 text-white rounded-lg font-medium hover:bg-primary-700 transition-colors">
                    Update Expense
                </button>
                <a href="{{ url_for('view_expenses') }}"
                   class="px-6 py-2.5 border border-slate-300 text-slate-700 rounded-lg font-medium hover:bg-slate-50 transition-colors">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>

<script>
    const categorySelect = document.getElementById('category');
    const customLabelGroup = document.getElementById('custom-label-group');

    function toggleCustomLabel() {
        if (categorySelect.value === 'Other') {
            customLabelGroup.classList.remove('hidden');
        } else {
            customLabelGroup.classList.add('hidden');
        }
    }

    categorySelect.addEventListener('change', toggleCustomLabel);
    toggleCustomLabel();
</script>
{% endblock %}
